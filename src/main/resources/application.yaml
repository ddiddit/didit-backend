spring:
  application:
    name: didit-api
  profiles:
    active: local
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

oauth:
  kakao:
    user-info-url: https://kapi.kakao.com/v2/user/me
    token-url: https://kauth.kakao.com/oauth/token
    token-info-url: https://kapi.kakao.com/v1/user/access_token_info
    rest-api-key: ${OAUTH_KAKAO_REST_API_KEY:}
    client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
    allowed-redirect-uris: ${OAUTH_KAKAO_ALLOWED_REDIRECT_URIS:https://app.didit.io.kr/auth/kakao/callback}
    app-id: ${OAUTH_KAKAO_APP_ID:}
  google:
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    allowed-client-ids: ${OAUTH_GOOGLE_ALLOWED_CLIENT_IDS:}
  apple:
    jwks-url: https://appleid.apple.com/auth/keys

jwt:
  access-token-expiry-ms: 3600000
  refresh-token-expiry-days: 14

social-login:
  apple-enabled: ${OAUTH_APPLE_ENABLED:false}
  session-expiry-minutes: 15
  email-verification:
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60

achievement:
  feature-launched-at: ${ACHIEVEMENT_FEATURE_LAUNCHED_AT:2026-06-30T00:00:00}

clova:
  api:
    url: https://clovastudio.stream.ntruss.com/v3/chat-completions/HCX-005
    api-key: ${CLOVA_API_KEY}

  speech:
    invoke-url: ${CLOVA_SPEECH_INVOKE_URL}
    secret-key: ${CLOVA_SPEECH_SECRET_KEY}

openai:
  api-key: ${OPENAI_API_KEY}
  chat:
    model: gpt-5.4-mini
  speech:
    model: gpt-4o-transcribe

admin:
  initial:
    username: ${ADMIN_INITIAL_USERNAME}
    password: ${ADMIN_INITIAL_PASSWORD}
  invite:
    expiry-hours: 48

retrospective:
  whitelist-emails: ${RETROSPECTIVE_WHITELIST_EMAILS}
